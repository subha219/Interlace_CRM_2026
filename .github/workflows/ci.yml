name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Tests/InterlaceUI.Tests/InterlaceUI.Tests.csproj
      - name: Build
        run: dotnet build Tests/InterlaceUI.Tests/InterlaceUI.Tests.csproj --no-restore -c Release
      - name: Test
        run: dotnet test Tests/InterlaceUI.Tests/InterlaceUI.Tests.csproj --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/results.trx'
